# The application stack. Run it through deploy/deploy.sh, never by hand with plain `up`.
# Values like ${DOMAIN} come from deploy/.env (created by deploy/init-env.sh, never committed).
#
# Production:  /opt/engage/backend/deploy,          project "engage"          (this file)
# Staging:     /opt/engage-staging/backend/deploy,  project "engage-staging"  (this file + docker-compose.staging.yml)
# Each project has its own containers, database, Valkey, storage volume and images. Only
# production's Caddy publishes ports 80/443; it hands the staging domains to the staging stack's
# own gateway over the shared "engage-edge" network, which no database or cache is attached to.
name: engage

x-backend: &backend
  image: ${IMAGE_PREFIX:-engage}-backend:latest
  pull_policy: never # built locally by deploy.sh
  restart: unless-stopped
  volumes:
    - ../.env:/app/.env:ro
    - storage:/app/storage
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *backend
    build: { context: .., dockerfile: deploy/Dockerfile }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  horizon:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php artisan horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php artisan schedule:work"]

  reverb:
    <<: *backend
    command: ["sh", "-c", "php artisan optimize && exec php artisan reverb:start --host=0.0.0.0 --port=8080"]

  web:
    image: ${IMAGE_PREFIX:-engage}-web:latest
    pull_policy: never
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${DOMAIN}
        NEXT_PUBLIC_REVERB_PORT: "443"
        NEXT_PUBLIC_REVERB_SCHEME: https
    environment:
      BACKEND_URL: http://app:8000
    restart: unless-stopped
    healthcheck: { disable: true }
    logging: *logging

  # Public marketing website (repo: engage-site, checked out at /opt/engage/site).
  # Only built and started by `deploy.sh site`; it reads plans from the API over the internal network.
  site:
    image: ${IMAGE_PREFIX:-engage}-site:latest
    pull_policy: never
    build:
      context: ../../site
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:-engage.10xdigital.ae}
        NEXT_PUBLIC_APP_URL: https://${DOMAIN}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${SITE_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    environment:
      ENGAGE_API_URL: http://app:8000/api/v1
    restart: unless-stopped
    healthcheck: { disable: true }
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      # Until the website has a domain, its proxy entry listens on a name nobody can reach.
      SITE_DOMAIN: ${SITE_DOMAIN:-http://site.internal}
      SITE_REDIRECT_DOMAINS: ${SITE_REDIRECT_DOMAINS:-http://site-redirect.internal}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Staging hostnames, comma separated (st-app…, st-engage-admin…, st-engage…). Their HTTPS
      # certificates live here; the requests go on to the staging stack's gateway.
      STAGING_DOMAINS: ${STAGING_DOMAINS:-http://staging.internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    logging: *logging

  postgres:
    image: postgres:17
    restart: unless-stopped
    # Every queue worker and every web worker holds one connection. Horizon's maximum is ~45
    # (config/horizon.php); 200 leaves ample room for the web server, the scheduler and psql.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENGAGE_DB_PASSWORD: ${ENGAGE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-engage.sh:ro
    healthcheck:
      # Over TCP on purpose: during first-boot init Postgres runs a temporary socket-only server,
      # which would look "ready" over the socket and then restart under the app's feet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  storage:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:

networks:
  # Shared with the staging stack's gateway only (created by deploy.sh). Nothing else joins it,
  # so the service names of one stack (app, postgres, valkey…) never resolve in the other.
  edge:
    name: engage-edge
    external: true
