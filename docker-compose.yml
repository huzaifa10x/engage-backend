name: engage

x-app: &app
  build: { context: ., dockerfile: docker/php/Dockerfile }
  volumes: [".:/var/www/html"]
  # No env_file: Laravel reads .env itself. OS-level vars would override phpunit.xml
  # (APP_ENV / DB_DATABASE) and `artisan serve` strips non-allowlisted vars anyway.
  environment:
    DB_HOST: postgres
    REDIS_HOST: valkey
    MAIL_HOST: mailpit
    # Server-to-server: Laravel publishes events to the reverb container over the compose network.
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports: ["8000:8000"]

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  # WebSocket server for the inbox (requires `composer require laravel/reverb`). Browsers connect to
  # ws://localhost:8080; Laravel publishes to http://reverb:8080 inside the network.
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]

  # Super Admin assets (Vite + HMR). Stopping it removes public/hot; run `npm run build` for static assets.
  vite:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports: ["5173:5173"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: valkey-server --appendonly yes
    volumes: [valkeydata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  valkeydata:
