name: Test & deploy

# Branch → environment, fixed here and checked again on the server:
#   staging → staging     (/opt/engage-staging, deploys automatically after the tests pass)
#   main    → production  (/opt/engage, waits for approval when the "production" environment
#                          has required reviewers: Settings → Environments → production)
on:
  push:
    branches: [main, staging]
  workflow_dispatch: # "Run workflow" button in the Actions tab (choose the branch there)

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: engage
      DB_PASSWORD: engage
    steps:
      - uses: actions/checkout@v4

      - name: Database roles (same as local dev — app role is NOT superuser, so RLS applies)
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f docker/postgres/init/01-engage.sql

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, pcntl, zip
          coverage: none

      - name: Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Super Admin assets
        run: npm ci --no-audit --no-fund && npm run build

      - name: Prepare app
        run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

  deploy:
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://app.10xdigital.ae' || 'https://st-app.10xdigital.ae' }}
    steps:
      - name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_ACTOR: ${{ github.actor }} (GitHub Actions)
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_ACTOR
          script: |
            if [ "${{ github.ref_name }}" = main ]; then
              bash /opt/engage/backend/deploy/deploy.sh backend
            else
              bash /opt/engage-staging/backend/deploy/deploy.sh --env staging backend
            fi
